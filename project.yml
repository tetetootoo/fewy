name: Fewy
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
targets:
  Fewy:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: FewyWidget
      - package: GoogleMobileAds
    entitlements:
      path: App/Fewy.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bramlen.pocketpress]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fewy
        GADApplicationIdentifier: "ca-app-pub-3529145868756395~2752754368"
        GADNativeAdUnitIdentifier: "ca-app-pub-3529145868756395/1966286307"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [pocketpress]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bramlen.pocketpress
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  FewyWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/FewyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bramlen.pocketpress]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Fewy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bramlen.pocketpress.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
schemes:
  Fewy:
    build:
      targets:
        Fewy: all
    run:
      config: Debug
